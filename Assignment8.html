<body>

    <h1>Hyperlinks and Images</h1>

    <h2>Hyperlinks</h2>

    <p>Click the link below to visit Google:</p>

    <a href="https://www.google.com">Visit Google</a>

    <p>Open Google in a new tab:</p>

    <a href="https://www.google.com" target="_blank">Open Google</a>

    <h2>Images</h2>

    <p>Example of an image:</p>

    <img src="https://placehold.co/300x200"
    alt="Sample Image" width="300" height="200">

    <h2>Image as a Link</h2>

    <a href="https://www.google.com">
        <img src="https://placehold.co/150x100"
        alt="Click this image to visit Google"
        width="150" height="100">
    </a>

</body>
</html>
