
<!DOCTYPE html>
<html>
<head>
    <title>Assignment 14</title>
</head>
<body>

    <h1>Nested and Responsive Tables</h1>

    <h2>Nested Table</h2>

    <table border="1">
        <tr>
            <th>Student Name</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>
                <table border="1">
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>

                    <tr>
                        <td>Maths</td>
                        <td>85</td>
                    </tr>

                    <tr>
                        <td>English</td>
                        <td>90</td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>
                <table border="1">
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>

                    <tr>
                        <td>Science</td>
                        <td>88</td>
                    </tr>

                    <tr>
                        <td>Computer</td>
                        <td>95</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <h2>Responsive Table</h2>

    <div style="overflow-x: auto;">

        <table border="1">
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>College</th>
                <th>City</th>
            </tr>

            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>BCA</td>
                <td>ABC College</td>
                <td>Delhi</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Priya</td>
                <td>B.Tech</td>
                <td>XYZ College</td>
                <td>Noida</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Aman</td>
                <td>BBA</td>
                <td>ABC College</td>
                <td>Meerut</td>
            </tr>
        </table>

    </div>

</body>
</html>
