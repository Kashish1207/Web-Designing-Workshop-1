<!DOCTYPE html>
<html>
<head>
    <title>Assignment 11</title>
</head>
<body>

    <h1>HTML Accessibility</h1>

    <h2>Accessible Image</h2>

    <img src="https://placehold.co/250x150"
    alt="A sample landscape image">

    <h2>Accessible Navigation</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <h2 id="home">Home</h2>
    <p>Welcome to my webpage.</p>

    <h2 id="about">About</h2>
    <p>This webpage demonstrates HTML accessibility.</p>

    <h2 id="contact">Contact Form</h2>

    <form>
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Enter Your Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <button type="submit">Submit</button>
    </form>

    <footer>
        <p>Thank you for visiting my webpage.</p>
    </footer>

</body>
</html>
